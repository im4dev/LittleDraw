<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD18C"/>
      <stop offset=".55" stop-color="#D9B666"/>
      <stop offset="1" stop-color="#C9A24A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#16130E"/>

  <!-- vane -->
  <path d="M398 66
           C 300 78, 214 160, 196 312
           C 262 300, 370 214, 398 66 Z" fill="url(#gold)"/>
  <!-- barb notches: wedges cut from the vane's edges toward the shaft -->
  <g fill="#16130E">
    <path d="M273 111 L 320 131 L 282 103 Z"/>
    <path d="M231 162 L 279 181 L 238 152 Z"/>
    <path d="M202 225 L 234 247 L 206 214 Z"/>
    <path d="M276 275 L 223 302 L 266 282 Z"/>
    <path d="M328 231 L 265 257 L 320 239 Z"/>
    <path d="M374 165 L 315 193 L 368 175 Z"/>
  </g>
  <!-- shaft through the vane -->
  <path d="M396 70 C 330 150, 262 236, 198 316" stroke="#16130E" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- quill below the vane, down to the nib -->
  <path d="M200 314 C 184 336, 170 356, 158 376" stroke="#C9A24A" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M164 366 L 142 408 L 172 382 Z" fill="#E3C57A"/>

  <!-- ink flourish from the nib, curling like the wordmark's ornaments -->
  <path d="M142 410 C 180 430, 250 436, 300 416 C 342 398, 360 372, 340 356 C 322 342, 300 356, 310 372"
        stroke="#C9A24A" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="312" cy="374" r="13" fill="#C9A24A"/>
  <path d="M96 446 C 170 438, 300 452, 420 440" stroke="#8F7430" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
