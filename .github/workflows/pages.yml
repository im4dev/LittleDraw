name: Web

# Publishes site/ to GitHub Pages, with the README screenshots, the icon and
# the heading font copied in.

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshots/**, resources/icon.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/img _site/fonts
          cp -r site/. _site/
          cp docs/screenshots/*.png resources/icon.png _site/img/
          cp crates/core/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2 _site/fonts/excalifont.woff2
          cp crates/core/fonts/OFL.txt _site/fonts/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
