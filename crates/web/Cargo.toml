[package]
name = "littledraw-web"
description = "LittleDraw in the browser: the editor compiled to WebAssembly, painted with Canvas 2D"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.107"
littledraw-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["CanvasRenderingContext2d", "CanvasWindingRule", "Document", "Element", "HtmlCanvasElement", "HtmlImageElement", "Path2d", "Window"] }
